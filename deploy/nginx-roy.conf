# РОЙ.IO — nginx snippet for serving the game under http://45.114.61.202/roy
#
# 1) The `map` below must exist ONCE in the http{} block (NOT inside server{}).
#    If your config already has a `map $http_upgrade $connection_upgrade` (likely, if
#    the root site or /kazik use websockets), DO NOT add it again — nginx will refuse to start.
#
#    map $http_upgrade $connection_upgrade {
#        default upgrade;
#        ''      close;
#    }
#
# 2) Paste the two location blocks below INTO the existing `server { ... }` block that
#    already serves 45.114.61.202 (the same one with `location /` and `location /kazik`).
#    `/roy/` is more specific than `/`, so nginx matches it first.

location = /roy { return 301 /roy/; }

location /roy/ {
    # trailing slash on proxy_pass strips the /roy/ prefix:
    #   /roy/                     -> /
    #   /roy/src/client/main.js   -> /src/client/main.js
    proxy_pass http://127.0.0.1:3007/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # websocket upgrade
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;   # keep idle game sockets alive
    proxy_buffering off;        # realtime — don't buffer
}
